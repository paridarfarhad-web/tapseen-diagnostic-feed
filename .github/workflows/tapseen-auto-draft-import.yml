name: TapSeen auto-import new drafts (Persian & English)

on:
  push:
    branches:
      - main
    paths:
      - 'publish-test/articles/*.json'
      - 'publish-test/articles-en/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tapseen-draft-import-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  import_new_drafts:
    name: Import newly added draft JSONs only
    runs-on: ubuntu-latest
    environment: tapseen-draft-writer
    timeout-minutes: 15
    steps:
      - name: Checkout with parent history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify importer tests
        run: node --test publish-test/bridge/import-draft.test.mjs

      - name: Safely identify added JSON files
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"

          > "$RUNNER_TEMP/added.txt"

          # 1. If this is a push with a valid commit range, check files added between before and sha
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=A "$BEFORE" "$SHA" -- 'publish-test/articles/*.json' 'publish-test/articles-en/*.json' | tr -d '\r' | sort -u | grep -v '^$' > "$RUNNER_TEMP/added.txt" || true
          fi

          # 2. If nothing found or before is not available, check files added in the current commit
          if [ ! -s "$RUNNER_TEMP/added.txt" ]; then
            git diff-tree --no-commit-id --name-only --diff-filter=A -r "$SHA" -- 'publish-test/articles/*.json' 'publish-test/articles-en/*.json' | tr -d '\r' | sort -u | grep -v '^$' > "$RUNNER_TEMP/added.txt" || true
          fi

          # 3. Fallback: if still empty (e.g. manual workflow_dispatch), inspect recent commits
          if [ ! -s "$RUNNER_TEMP/added.txt" ]; then
            git log -n 25 --name-only --diff-filter=A --pretty="" -- 'publish-test/articles/*.json' 'publish-test/articles-en/*.json' | tr -d '\r' | sort -u | grep -v '^$' > "$RUNNER_TEMP/added.txt" || true
          fi
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const raw = readFileSync(process.env.RUNNER_TEMP+"/added.txt","utf8");
            const paths = raw.split("\n").map(s => s.trim()).filter(Boolean);
            if (paths.length > 25) throw Error("Too many candidate drafts (limit 25)");
            if (paths.some(p => !/^publish-test\/(articles|articles-en)\/[a-z0-9][a-z0-9-]{1,110}\.json$/.test(p))) throw Error("Unsafe path");
            writeFileSync(process.env.RUNNER_TEMP+"/paths.json",JSON.stringify(paths));
            console.log("Candidate draft files to verify/import:", paths.length);
          '

      - name: Import drafts via authenticated draft-only RPC
        env:
          TAPSEEN_DRAFT_WRITE: "true"
          TAPSEEN_SUPABASE_URL: ${{ secrets.TAPSEEN_SUPABASE_URL }}
          TAPSEEN_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TAPSEEN_SUPABASE_PUBLISHABLE_KEY }}
          TAPSEEN_BLOG_AUTHOR_EMAIL: ${{ secrets.TAPSEEN_BLOG_AUTHOR_EMAIL }}
          TAPSEEN_BLOG_AUTHOR_PASSWORD: ${{ secrets.TAPSEEN_BLOG_AUTHOR_PASSWORD }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { run } from "./publish-test/bridge/import-draft.mjs";
            const files = JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/paths.json","utf8"));
            for (const path of files) {
              try {
                await run(path);
              } catch (err) {
                console.warn("Skipping " + path + ": " + (err?.message || err));
              }
            }
          '